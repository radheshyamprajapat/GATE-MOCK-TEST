<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Subject Mock Tests | GATE Physics</title>

<link rel="stylesheet" href="exam.css">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>


<header class="mock-navbar">

<div class="mock-nav-inner">

<a href="../index.html" class="mock-logo">

<div class="mock-logo-icon">
<i class="fa-solid fa-atom"></i>
</div>

<div>
<strong>GATE Physics</strong>
<span>2027</span>
</div>

</a>

<a href="index.html" class="back-home">
<i class="fa-solid fa-arrow-left"></i>
All Mock Tests
</a>

</div>

</header>


<section class="subject-hero">

<div class="hero-small">
SUBJECT-WISE PRACTICE
</div>

<h1 id="subjectTitle">
Quantum Mechanics
</h1>

<p id="subjectDescription">
Practice GATE-level questions.
</p>

</section>


<section class="mock-section">

<div class="section-title">

<div>

<span>AVAILABLE TESTS</span>

<h2 id="subjectHeading">
Quantum Mechanics Mock Tests
</h2>

</div>

<div class="test-count">
3 Tests
</div>

</div>


<div class="test-grid" id="subjectTests"></div>

</section>


<script>

const params =
new URLSearchParams(window.location.search);

const subject =
params.get("subject") || "quantum";


const subjects = {

quantum: {
name:"Quantum Mechanics",
icon:"⚛",
description:"Operators, angular momentum, harmonic oscillator, perturbation theory and quantum concepts."
},

electrodynamics: {
name:"Electrodynamics",
icon:"∿",
description:"Electrostatics, Maxwell equations, electromagnetic waves, potentials and radiation."
},

classical: {
name:"Classical Mechanics",
icon:"◉",
description:"Lagrangian mechanics, Hamiltonian mechanics, central force motion and oscillations."
},

thermal: {
name:"Thermal Physics",
icon:"◈",
description:"Thermodynamics, kinetic theory, ensembles, entropy and statistical mechanics."
},

condensed: {
name:"Condensed Matter Physics",
icon:"◌",
description:"Crystal structure, lattice vibrations, band theory, semiconductors and solids."
},

nuclear: {
name:"Nuclear Physics",
icon:"☢",
description:"Nuclear structure, radioactive decay, nuclear reactions and nuclear models."
},

atomic: {
name:"Atomic & Molecular Physics",
icon:"✦",
description:"Atomic spectra, angular momentum, Zeeman effect, molecular spectra and selection rules."
},

mathematical: {
name:"Mathematical Physics",
icon:"∫",
description:"Vector calculus, complex analysis, Fourier methods, differential equations and special functions."
}

};


const data =
subjects[subject] || subjects.quantum;


document.title =
data.name + " Mock Tests | GATE Physics";


document.getElementById("subjectTitle").textContent =
data.name;


document.getElementById("subjectHeading").textContent =
data.name + " Mock Tests";


document.getElementById("subjectDescription").textContent =
data.description;


const container =
document.getElementById("subjectTests");


for(let i=1;i<=3;i++){

container.innerHTML += `

<a href="mock-test.html?test=${subject}-${i}"
class="test-card">

<div class="test-card-number">
0${i}
</div>

<div class="test-card-icon">
${data.icon}
</div>

<div class="test-card-content">

<span>${data.name.toUpperCase()}</span>

<h3>
${data.name} Mock Test 0${i}
</h3>

<p>
GATE-level subject practice
</p>

<div class="mini-info">

<i class="fa-regular fa-clock"></i>
15 min

&nbsp;&nbsp;

<i class="fa-solid fa-list-check"></i>
10 Q

</div>

</div>

<div class="test-arrow">
<i class="fa-solid fa-arrow-right"></i>
</div>

</a>

`;

}

</script>

</body>
</html>
