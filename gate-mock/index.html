<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mock Test Centre - GATE Physics 2027</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <header class="navbar">
    <div class="nav-container">
      <a href="../index.html" class="logo">⚛️ GATE <span>Physics '27</span></a>
      <ul class="nav-links">
        <li><a href="../index.html">Home</a></li>
        <li><a href="index.html" class="active">Mock Tests</a></li>
        <li><a href="../pyq.html">PYQs</a></li>
        <li><a href="../resources.html">Resources</a></li>
        <li><a href="../about.html">About</a></li>
      </ul>
    </div>
  </header>

  <main class="container">
    <h1 class="section-title">Mock Test Centre</h1>
    <p class="section-subtitle">Select a subject category to access specific standard tests.</p>

    <div class="card-grid" id="mock-subject-grid">
      </div>
  </main>

  <script src="../tests.js"></script>
  <script>
    const container = document.getElementById('mock-subject-grid');
    if (window.TEST_CATALOG && window.TEST_CATALOG.subjects) {
      window.TEST_CATALOG.subjects.forEach(sub => {
        const testCount = sub.tests ? sub.tests.length : 0;
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-icon">${sub.icon}</div>
          <h3 class="card-title">${sub.name}</h3>
          <p class="card-desc">${testCount} Test(s) Available</p>
          <a href="subject.html?subject=${sub.id}" class="btn btn-primary" style="width: 100%;">View Tests →</a>
        `;
        container.appendChild(card);
      });
    }
  </script>
</body>
</html>
