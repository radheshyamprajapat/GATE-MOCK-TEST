<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mock Test</title><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="exam.css"></head><body>
<header class="examtop"><div class="examtopin"><div><b id="testTitle">Loading...</b><div class="muted" id="subjectName"></div></div><div class="timer" id="timer">30:00</div></div></header>
<main class="examgrid"><section class="question"><div class="muted" id="qno"></div><h2 id="qtext"></h2><div id="options"></div><div class="controls"><button class="btn secondary" onclick="prev()">← Previous</button><button class="btn" onclick="next()">Next →</button></div><button class="btn" style="margin-top:14px;background:#15803d" onclick="finish()">Submit Test</button></section>
<aside class="palette"><b>Question Palette</b><div id="palette" class="numbers"></div></aside></main>
<script src="../tests.js"></script><script src="exam.js"></script><script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</body></html>
